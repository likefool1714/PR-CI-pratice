name: backend CI

on:
  pull_request:
    branches: [develop]                     # develop으로 향하는 PR에서 실행
    paths:                                  # 아래 경로가 바뀐 PR에서만 실행
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'  # 이 파일 자체가 바뀌어도 실행
  workflow_dispatch:                        # Actions 화면의 수동 실행 버튼

jobs:
  test:                                     # Job 1: 단위·API 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend          # 아래 run 명령은 backend 폴더에서 실행
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7
      - name: 파이썬 설치
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 테스트 실행
        run: pytest -v                      # 하나라도 실패하면 이 Job은 ❌

  docker:                                   # Job 2: 이미지 빌드 + 실제 실행 확인
    runs-on: ubuntu-latest
    needs: test                             # test가 성공해야 시작
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7
      - name: 이미지 빌드
        run: docker build -t backend-ci ./backend
      - name: 컨테이너 실행
        run: docker run -d --name backend -p 8000:8000 backend-ci
      - name: /health 응답 확인 (최대 30초 대기)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "서버가 30초 안에 응답하지 않았습니다"
          docker logs backend                # 실패 원인을 로그로 남김
          exit 1
